# Pre-training Configuration for Vi-SmolLM2-135M

model:
  base_model: "HuggingFaceTB/SmolLM2-135M"
  vocab_size: 32000
  max_position_embeddings: 2048
  # true = keep SmolLM2's pretrained transformer layers, re-init only the embeddings
  # (new tokenizer). false = random init. 300-step smoke test: VTSNLP eval
  # loss 6.57 (true) vs 7.33 (false).
  init_from_base: true

training:
  output_dir: "./vi-smollm-135m-pretrain"
  learning_rate: 5.0e-4
  num_train_epochs: 1            # one pass over the packed tokens (no repeated data)
  max_steps: -1                  # -1 = derived from num_train_epochs
  per_device_train_batch_size: 4  # fp32 master weights: bs 8 peaks at 23.1 GB (OOM on 24 GB), bs 4 at 12.5 GB
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 8  # global batch = 4 x n_gpu x 8 (64 seqs ~131k tokens on 2 GPU)
  warmup_steps: 1000
  weight_decay: 0.1
  adam_beta2: 0.95               # 0.999 + small batch spiked; 0.95 is the usual LLM setting
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  bf16: true
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 1000               # must be a multiple of eval.eval_steps (load_best_model_at_end)
  save_total_limit: 3            # the best checkpoint is always kept on top of this
  load_best_model_at_end: true   # final model = best eval checkpoint, not the last one
  metric_for_best_model: "eval_vtsnlp_loss"
  dataloader_num_workers: 2
  ddp_timeout: 14400             # seconds; other ranks wait while rank 0 tokenizes + packs

data:
  dataset_name: "uonlp/CulturaX"
  dataset_subset: "vi"
  # ~560M tokens per shard -> ~5.6B tokens. vi_part_00010 is held out for eval, never train on it.
  data_files: "vi/vi_part_0000[0-9].parquet"
  stream: false
  max_samples: null              # null = every document in data_files
  max_length: 2048               # packed block size
  num_proc: 32                   # tokenization workers

eval:
  eval_steps: 1000               # null disables eval during training
  vtsnlp_docs: 1000              # VTSNLP/vietnamese_curated_dataset (plan eval set)
  culturax_heldout_file: "vi/vi_part_00010.parquet"
  culturax_docs: 1000

early_stopping:
  patience: 5                    # stop after 5 evals (5k steps) without a better eval_vtsnlp_loss
  threshold: 0.0
  loss_spike_threshold: 0.5      # stop if train-loss EMA stays 0.5 above its best ...
  loss_spike_patience: 20        # ... for 20 logs (200 steps)
  loss_spike_warmup: 1000        # ignore the warmup phase

tracking:
  report_to: "mlflow"             # "none" to disable
  tracking_uri: "sqlite:///mlflow.db"  # local; UI: uv run mlflow ui --backend-store-uri sqlite:///mlflow.db
  experiment_name: "vi-smollm2-135m"
  run_name: null                 # null = <stage>-<YYYYmmdd-HHMM>
