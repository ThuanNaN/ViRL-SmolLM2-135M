# DPO Safety Alignment Configuration for Vi-SmolLM2-135M

model:
  base_model: "./vi-smollm-135m-sft"

training:
  output_dir: "./vi-smollm-135m-censored"
  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  warmup_steps: 0.1
  beta: 0.1
  loss_type: ["sigmoid", "sft"]
  loss_weights: [1.0, 2.0]
  num_train_epochs: 3
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  max_length: 1024
  logging_steps: 10
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 3
  load_best_model_at_end: true
  bf16: true

data:
  data_dir: "./data/dpo_safety_vi"
  system_prompt: "You are a helpful Vietnamese assistant."
  extra_sets: [short, imperative]
  refusal_only: true

eval:
  refusal_prompts: 100
  max_new_tokens: 96

early_stopping:
  patience: 4
  threshold: 0.0

tracking:
  report_to: "mlflow"             # "none" to disable
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "vi-smollm2-135m"
  run_name: null
